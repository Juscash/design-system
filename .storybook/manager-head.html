<!--
  Tradução pt-BR do manager do Storybook 10.

  Storybook 10 não tem i18n oficial. Aplicamos duas técnicas:

  1. CSS — esconde elementos com texto em inglês que abrem MDX/diálogos longos.
  2. JS (MutationObserver throttled) — traduz textos e atributos visíveis.

  IMPORTANTE: o dicionário não cobre todos os ~1500 strings do Storybook;
  cobre os mais visíveis. Strings raras (erros técnicos, descrições do
  axe-core/a11y rules, conteúdo do "Guia"/"Novidades") ficam em inglês ou são
  escondidas via CSS.
-->

  [role="tab"][data-key="whats-new"],
  a[href*="/settings/guide"],
  a[href*="/settings/whats-new"] {
    display: none !important;

  /* Botão "Share" / "Publish" do Chromatic */
  button[aria-label*="Share your Storybook"],
  button[aria-label*="Publish your Storybook"] {
    display: none !important;
  }
</style>

    var DICT_ATTR = Object.assign({}, DICT_TEXT, {
      "Settings": "Configurações",
      "Collapse": "Recolher",

    /* DICT_TEXT_SCOPED — só dentro de containers seguros (tabs/headers). */
    var DICT_TEXT_SCOPED = {
      "Code": "Código",
      "Name": "Nome",
      "Control": "Controle",
      "Description": "Descrição",
    };

    var ATTRS = ["title", "aria-label", "placeholder", "alt"];

    function isInScopedContainer(node) {
      var el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      var depth = 0;
      while (el && el !== document.body && depth < 10) {
        if (
          el.getAttribute &&
          (el.getAttribute("role") === "tab" ||
            el.getAttribute("role") === "columnheader" ||
            el.tagName === "TH")
        ) {
          return true;
        }
        el = el.parentElement;
        depth++;
      }
      return false;
    }

    function translateTextNode(node) {
      if (node.nodeType !== Node.TEXT_NODE) return;
      var raw = node.nodeValue || "";
      var trimmed = raw.trim();
      if (!trimmed) return;

      var translated = DICT_TEXT[trimmed];
      if (translated) {
        node.nodeValue = raw.replace(trimmed, translated);
        return;
      }

      var m = trimmed.match(/^(\d+)% completed$/);
      if (m) {
        node.nodeValue = raw.replace(trimmed, m[1] + "% concluído");
        return;
      }
      var m2 = trimmed.match(/^Open onboarding guide for (.+)$/);
      if (m2) {
        var rest = DICT_TEXT[m2[1]] || m2[1];
        node.nodeValue = raw.replace(trimmed, "Abrir guia de onboarding para " + rest);
        return;
      }

      if (DICT_TEXT_SCOPED[trimmed] && isInScopedContainer(node)) {
        node.nodeValue = raw.replace(trimmed, DICT_TEXT_SCOPED[trimmed]);
      }
    }

    function translateAttrs(el) {
      if (!el || el.nodeType !== Node.ELEMENT_NODE || !el.getAttribute) return;
      for (var i = 0; i < ATTRS.length; i++) {
        var attr = ATTRS[i];
        var v = el.getAttribute(attr);
        if (!v) continue;
        var t = DICT_ATTR[v];
        if (t) {
          el.setAttribute(attr, t);
          continue;
        }
        var m = v.match(/^Open onboarding guide for (.+)$/);
        if (m) {
          var rest = DICT_ATTR[m[1]] || m[1];
          el.setAttribute(attr, "Abrir guia de onboarding para " + rest);
        }
      }
    }

    function walkText(root) {
      var iter = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var n;
      while ((n = iter.nextNode())) translateTextNode(n);
    }

    function walkAttrs(root) {
      if (root.nodeType === Node.ELEMENT_NODE) translateAttrs(root);
      if (!root.querySelectorAll) return;
      root.querySelectorAll("[title],[aria-label],[placeholder],[alt]").forEach(translateAttrs);
    }

    function killOnboardingContainer() {
      var sel =
        'button[aria-label^="Abrir guia de onboarding"],' +
        'button[aria-label^="Open onboarding guide"],' +
        'button[aria-label^="Become an expert"],' +
        'button[aria-label^="Vire especialista"]';
      document.querySelectorAll(sel).forEach(function (btn) {
        var cur = btn;
        for (var i = 0; i < 6 && cur && cur.parentElement; i++) cur = cur.parentElement;
        if (cur && cur !== document.body && cur.style.display !== "none") {
          cur.style.display = "none";
        }
      });
    }

    /* Throttle: agrupa mutations em rajadas de 50ms. */
    var pending = new Set();
    var scheduled = false;
    function flush() {
      scheduled = false;
      pending.forEach(function (node) {
        if (!node || !node.isConnected) return;
        if (node.nodeType === Node.TEXT_NODE) translateTextNode(node);
        else if (node.nodeType === Node.ELEMENT_NODE) {
          translateAttrs(node);
          walkText(node);
          walkAttrs(node);
        }
      });
      pending.clear();
      killOnboardingContainer();
    }
    function schedule(node) {
      pending.add(node);
      if (!scheduled) {
        scheduled = true;
        setTimeout(flush, 50);
      }
    }

    function init() {
      walkText(document.body);
      walkAttrs(document.body);
      killOnboardingContainer();

      var obs = new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var m = mutations[i];
          for (var j = 0; j < m.addedNodes.length; j++) schedule(m.addedNodes[j]);
          if (m.type === "attributes" && m.target) schedule(m.target);
          if (m.type === "characterData" && m.target) schedule(m.target);
        }
      });

      obs.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true,
        attributes: true,
        attributeFilter: ATTRS,
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
